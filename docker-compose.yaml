version: "3.8"

services:
  mongo-db:
    image: mongo:6.0
    container_name: mongo-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: liverpool_db
    volumes:
      - ./database/data.js:/docker-entrypoint-initdb.d/data.js:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  back-app:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: back-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo-db:27017/liverpool_db
    depends_on:
      mongo-db:
        condition: service_healthy

  front-app:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front-app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - back-app 

volumes:
  mongo_data: